############################################################
# APPLICATION
############################################################

spring.application.name=SentinelCore SecureOps

server.port=8080

############################################################
# POSTGRESQL DATABASE
############################################################

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/secureopsprojectes}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=org.postgresql.Driver

############################################################
# JPA / HIBERNATE
############################################################

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

############################################################
# CONNECTION POOL (OPTIMIZED FOR NEON SERVERLESS POSTGRES)
############################################################

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=45000
spring.datasource.hikari.leak-detection-threshold=60000

############################################################
# JWT
############################################################

jwt.secret=ThisIsMyVerySecureJWTSecretKeyForSentinelCoreSecureOpsApplication2026

jwt.expiration=86400000

############################################################
# ASSET DISCOVERY
############################################################

asset.discovery.enabled=true

asset.discovery.interval=300000

asset.scan.subnet=192.168.1

############################################################
# OSHI
############################################################

oshi.enabled=true

############################################################
# FILE UPLOAD
############################################################

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=50MB

############################################################
# MAIL CONFIGURATION
############################################################

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=your-email@gmail.com

spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

############################################################
# JACKSON
############################################################

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.time-zone=Asia/Kolkata

############################################################
# SWAGGER
############################################################

springdoc.api-docs.enabled=true

springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

############################################################
# ACTUATOR
############################################################

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

management.info.env.enabled=true

############################################################
# LOGGING
############################################################

logging.level.root=INFO

logging.level.com.internship.infosys=DEBUG

logging.level.org.springframework.security=DEBUG

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

############################################################
# SERVER
############################################################

server.error.include-message=always

server.error.include-binding-errors=always

server.error.include-stacktrace=never

############################################################
# TIME ZONE
############################################################

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

############################################################
# CACHE
############################################################

spring.cache.type=simple

############################################################
# THYMELEAF (Optional)
############################################################

spring.thymeleaf.cache=false